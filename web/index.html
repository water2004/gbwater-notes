<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="碧山秋云：按课程整理的数学、物理与计算机笔记，支持全文检索、文内大纲与阅读进度。" />

    <script>
      try {
        const theme = localStorage.getItem('gbwater-theme')
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {}
    </script>
  </head>
