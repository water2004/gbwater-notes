name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./... && go test ./...
      - run: go test -tags integration -count=1 ./internal/app
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm test && npm run test:build
        working-directory: web

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    env:
      GBWATER_IMAGE: gbwater-notes:ci
      GBWATER_SITE_URL: https://notes.example.com
      GBWATER_ADMIN_EMAIL: admin@example.com
      GBWATER_ADMIN_PASSWORD: ci-only-admin-password-98
      GBWATER_DB_PASSWORD: 0123456789abcdef0123456789abcdef
      GBWATER_MEILISEARCH_KEY: ci-only-meilisearch-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        id: registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build Linux container
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.GBWATER_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.registry.outputs.image }}:build-cache
          cache-to: |
            type=gha,mode=max,ignore-error=true
            type=registry,ref=${{ steps.registry.outputs.image }}:build-cache,mode=max,ignore-error=true
      - name: Verify Linux publish workflow end to end
        run: bash deploy/smoke-image.sh
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test services
        if: always()
        run: docker compose down
      - name: Publish tested image
        id: publish
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag "$GBWATER_IMAGE" "$IMAGE:$version"
          docker push "$IMAGE:$version"
          docker tag "$GBWATER_IMAGE" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          digest="$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"

  release:
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Record image digest in the published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: |
          notes="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' \
            | sed '/^构建镜像摘要 `ghcr\.io\//d')"
          printf '%s\n\n构建镜像摘要 `%s`\n' "$notes" "$IMAGE_REF" > "$RUNNER_TEMP/release.md"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release.md"
